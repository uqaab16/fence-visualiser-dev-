<div style="font-family: sans-serif; max-width: 480px; margin: 0 auto; background: #f9f7f3; border-radius: 12px; overflow: hidden; border: 1px solid #e5e0d8;">
  
  <div style="background: #24272a; padding: 28px 32px; text-align: center;">
    <p style="color: #a7abb0; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; margin: 0;">
      Sign In Code
    </p>
  </div>

  <div style="padding: 36px 32px; text-align: center;">
    <p style="font-size: 14px; color: #3c4045; margin: 0 0 8px; font-weight: 600;">
      Your login code
    </p>
    <p style="font-size: 12px; color: #6b7280; margin: 0 0 28px;">
      Enter this code in the app to sign in. It expires in 60 minutes.
    </p>

    <div style="display: inline-block; background: #ffffff; border: 2px solid #e5e0d8;
                border-radius: 10px; padding: 16px 40px; font-size: 36px;
                font-weight: 800; letter-spacing: 0.35em; color: #1a1c1e;
                font-family: 'Courier New', monospace;">
      {{ .Token }}
    </div>

    <p style="font-size: 11px; color: #9ca3af; margin: 20px 0 0;">
      Do not share this code with anyone.
    </p>
  </div>

  <div style="background: #f0ece4; border-top: 1px solid #e5e0d8; padding: 14px 32px; text-align: center;">
    <p style="font-size: 10px; color: #9ca3af; margin: 0;">
      If you didn't request this code, you can safely ignore this email.
    </p>
  </div>

</div>
